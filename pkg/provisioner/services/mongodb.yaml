name: mongodb
display_name: MongoDB
category: database
description: |
  NoSQL document store. Quick prototypes, flexible-schema apps, and
  many JS/TS app templates. Connect to Atlas, Render, or any MongoDB-
  compatible host.

fields:
  - name: url
    label: Connection URL
    placeholder: mongodb+srv://user:pass@cluster.mongodb.net/db
    secret: true
    required: true
    prod_required: true
    pattern: ^mongodb(\+srv)?://.+$

# NOTE: deliberately no DATABASE_URL here. That name is the SQL
# convention (postgres + mysql inject it), and a cluster with both
# mongo AND a SQL DB bound would have two services fighting over one
# env var — last-write-wins in the shell, and excluding one binding
# in the deploy form used to collaterally kill the other's key.
# Mongo code reads MONGODB_URL / MONGODB_URI (the names our docs and
# the auth sidecar use).
inject:
  env:
    MONGODB_URL: "{url}"
    MONGODB_URI: "{url}"
  creds:
    /etc/sandbox/creds/mongodb/url: "{url}"

get_started: |
  Free MongoDB for dev:
  - **MongoDB Atlas** https://mongodb.com/atlas (512 MB free)
  - Self-hosted: `docker run -d -p 27017:27017 mongo:7`
