name: aws-s3
display_name: AWS S3 (and compat)
category: storage
description: |
  Object storage with the S3 API. Works with AWS S3 itself, Cloudflare R2,
  Backblaze B2, Wasabi, MinIO — anything S3-compatible. Set endpoint_url
  for non-AWS providers.

fields:
  - name: access_key_id
    label: Access Key ID
    required: true
    prod_required: true
  - name: secret_access_key
    label: Secret Access Key
    secret: true
    required: true
    prod_required: true
  - name: region
    label: Region
    default: us-east-1
    required: true
  - name: bucket
    label: Bucket name
    required: true
  - name: endpoint_url
    label: Endpoint URL (for R2, B2, MinIO; blank for AWS)
    required: false

inject:
  env:
    AWS_ACCESS_KEY_ID: "{access_key_id}"
    AWS_SECRET_ACCESS_KEY: "{secret_access_key}"
    AWS_REGION: "{region}"
    AWS_DEFAULT_REGION: "{region}"
    AWS_S3_BUCKET: "{bucket}"
    AWS_ENDPOINT_URL: "{endpoint_url}"
  creds:
    /etc/sandbox/creds/aws/credentials: |
      [default]
      aws_access_key_id = {access_key_id}
      aws_secret_access_key = {secret_access_key}
      region = {region}

get_started: |
  Free S3-compatible storage for dev:
  - **Cloudflare R2** https://cloudflare.com/r2 (10 GB free, no egress fees)
  - **Backblaze B2** https://backblaze.com (10 GB free)
  - **MinIO** self-hosted: `docker run -d -p 9000:9000 minio/minio server /data`
